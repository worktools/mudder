name: Prepare reviewed public source
on:
  push:
    branches: [prepare/mudder-public031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Resolve exact formal graph
        run: |
          set -euo pipefail
          test "$(calcit -v)" = 0.30.1
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml
      - name: Original complete gates before edits
        run: |
          set -euo pipefail
          mkdir -p acceptance
          calcit --check-only --all-defs
          if calcit fix --workflow strict --verify --format json > acceptance/strict-before.json; then
            jq -e '.data.workflow.status == "passed" and .diagnostics == []' acceptance/strict-before.json
          else
            jq -e '.data.workflow.status == "failed" and (.diagnostics | length == 2) and ([.diagnostics[].code] | all(. == "E_CALL_ARGUMENT_UNPROVEN")) and ([.diagnostics[].definition] | sort == ["app.comp.container/comp-container", "app.comp.container/comp-named"])' acceptance/strict-before.json
          fi
          calcit test --require-match --format json | tee acceptance/tests-before.json
          VITE_BASE_URL=./ yarn build
      - name: Official guarded source transaction
        run: node apply-reviewed.mjs
      - name: Complete original gates after edits
        run: |
          set -euo pipefail
          calcit edit format
          test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-after-blob.txt)"
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify --format json | tee acceptance/strict.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --require-match --format json | tee acceptance/tests.json
          VITE_BASE_URL=./ yarn build
          cp calcit.cirru acceptance/snapshot.cirru
          cp -R dist acceptance/dist
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: mudder-source-evidence
          path: acceptance
          if-no-files-found: error
          retention-days: 30
